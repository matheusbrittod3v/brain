id: BR-NOEMA-001
type: business_rule
title: Isolamento Multi-Tenant e RLS Fail-Closed
status: approved
access_policy: internal-project
trust_level: verified
priority: critical
tags: [security, rls, postgres, multi-tenant]
description: >
  Toda leitura ou escrita em produção deve usar a role brain_app (NOSUPERUSER NOBYPASSRLS)
  dentro de uma transação RLS configurada com app.current_tenant_id, app.current_actor_id,
  app.allowed_projects e app.allowed_policies derivados exclusivamente da identidade autenticada.
  Sem essas GUCs configuradas, o PostgreSQL deve retornar zero linhas e bloquear gravações (fail-closed).
conditions:
  - Identidade autenticada via OIDC JWT ou NOEMA_LOCAL_API_KEY
  - Transação executada via withRlsTransaction ou withTenantRls
effects:
  - Isolamento estrito por tenantId, projectId e accessPolicyId
  - Zero vazamento cross-tenant ou cross-project
exceptions:
  - Migrations e workers de sistema auditados usam brain_system (BYPASSRLS)

