id: BR-NOEMA-002
type: business_rule
title: Governança de Aprovação Humana Explícita
status: approved
access_policy: internal-project
trust_level: verified
priority: critical
tags: [governance, approval, humanops, mcp]
description: >
  Toda promoção de regra de negócio, ADR ou documento para status approved exige decisão
  humana explícita (approve, reject, request_changes) autenticada. Revisores humanos
  autorizados podem decidir via Command Center, API, callback assinado ou brain_change_decide
  pelo MCP. A decisão fica vinculada à versão da proposta e registrada em audit_logs append-only.
  Agentes e runners nunca podem aprovar ou decidir propostas, mesmo quando invocam ferramentas MCP.
conditions:
  - Proposta submetida em status draft via brain_change_propose ou Living Documentation
  - Revisor autorizado no domínio com proposalVersion correspondente
effects:
  - Expiração de prazo gera lembrete ou escalonamento, nunca aprovação automática
  - Histórico completo preservado na trilha de auditoria
  - Decisões por MCP usam o mesmo Approval Engine, escopo e permissões da API/Command Center

