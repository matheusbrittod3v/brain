services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain_dev_password
      POSTGRES_DB: project_brain_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d project_brain_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-ai", "full"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brain_minio
      MINIO_ROOT_PASSWORD: brain_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  temporal:
    image: temporalio/auto-setup:1.25
    profiles: ["full"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: brain
      POSTGRES_PWD: brain_dev_password
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  paradedb:
    image: paradedb/paradedb:0.15.2
    profiles: ["paradedb"]
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain_dev_password
      POSTGRES_DB: project_brain_os
    ports:
      - "5433:5432"

volumes:
  pgdata:
  ollamadata:
  miniodata:
