{{- if .Values.opa.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opa
  labels:
    app.kubernetes.io/name: brain
    app.kubernetes.io/component: opa
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brain
      app.kubernetes.io/component: opa
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brain
        app.kubernetes.io/component: opa
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: opa
          image: "{{ .Values.opa.image }}"
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "/policies/brain.rego"
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
          volumeMounts:
            - name: opa-policy
              mountPath: /policies
              readOnly: true
      volumes:
        - name: opa-policy
          configMap:
            name: {{ .Release.Name }}-opa-policy
{{- end }}

