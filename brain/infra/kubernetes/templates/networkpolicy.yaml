{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-netpol
  labels:
    app.kubernetes.io/name: brain
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: brain
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: brain
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
