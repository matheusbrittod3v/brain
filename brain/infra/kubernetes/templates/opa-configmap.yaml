{{- if .Values.opa.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opa-policy
  labels:
    app.kubernetes.io/name: brain
    app.kubernetes.io/component: opa
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  brain.rego: |
    package brain.authz

    default allow = false

    write_actions := {"write", "create", "update"}
    write_roles := {"developer", "tech-lead", "admin", "ci-bot", "agent"}
    critical_domains := {1, 2, 3, 7, 11}
    critical_approve_roles := {"tech-lead", "admin", "appsec"}
    standard_approve_roles := {"tech-lead", "admin", "appsec", "product-owner"}

    tenant_valid if {
      is_string(input.subject.tenantId)
      input.subject.tenantId != ""
      object.get(input.resource, "tenantId", null) == null
    }

    tenant_valid if {
      is_string(input.subject.tenantId)
      input.subject.tenantId != ""
      input.resource.tenantId == input.subject.tenantId
    }

    base_access_valid if {
      tenant_valid
      is_string(input.resource.projectId)
      input.resource.projectId != ""
      input.resource.projectId in input.subject.allowedProjects
      is_string(input.resource.accessPolicyId)
      input.resource.accessPolicyId != ""
      input.resource.accessPolicyId in input.subject.allowedPolicies
    }

    is_critical_domain if {
      input.resource.domainId in critical_domains
    }

    allow if {
      base_access_valid
      input.resource.action == "read"
    }

    allow if {
      base_access_valid
      input.resource.action in write_actions
      some role in input.subject.roles
      role in write_roles
    }

    allow if {
      base_access_valid
      input.resource.action == "approve"
      is_critical_domain
      input.subject.actorType != "agent"
      input.subject.actorType == "human"
      some role in input.subject.roles
      role in critical_approve_roles
    }

    allow if {
      base_access_valid
      input.resource.action == "approve"
      not is_critical_domain
      input.subject.actorType == "human"
      some role in input.subject.roles
      role in standard_approve_roles
    }
{{- end }}

